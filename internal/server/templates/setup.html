{{define "title"}}Setup - P2P Drop{{end}} {{define "content"}}
<div class="min-h-screen flex items-center justify-center p-4">
  <div
    class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl"
  >
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/10 text-indigo-400 mb-4 border border-indigo-500/20"
      >
        <svg
          class="w-8 h-8"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Welcome to P2P Drop</h1>
      <p class="text-gray-400 text-sm mt-1">
        Configure your device settings to get started
      </p>
    </div>

    <form id="setup-form" class="space-y-6">
      <div>
        <label
          class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2"
          for="device_name"
        >
          Device Name
        </label>
        <input
          type="text"
          id="device_name"
          name="device_name"
          value="{{.DeviceName}}"
          required
          class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm"
          placeholder="e.g. Anil-Laptop"
        />
      </div>

      <div>
        <label
          class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2"
          for="save_dir"
        >
          Save Directory
        </label>
        <input
          type="text"
          id="save_dir"
          name="save_dir"
          value="{{.SaveDir}}"
          required
          class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm font-mono"
          placeholder="./uploads"
        />
      </div>

      <div>
        <label
          class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2"
          for="udp_port"
        >
          UDP Discovery Port
        </label>
        <input
          type="number"
          id="udp_port"
          name="udp_port"
          value="{{.UDPPort}}"
          min="1024"
          max="65535"
          required
          class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm font-mono"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center gap-2 text-sm"
      >
        <span>Save & Get Started</span>
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M14 5l7 7m0 0l-7 7m7-7H3"
          />
        </svg>
      </button>
    </form>
  </div>
</div>
{{end}} {{define "scripts"}}
<script>
  document
    .getElementById("setup-form")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        device_name: document.getElementById("device_name").value.trim(),
        save_dir: document.getElementById("save_dir").value.trim(),
        udp_port: parseInt(document.getElementById("udp_port").value, 10),
      };

      try {
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          window.location.href = "/";
        } else {
          const err = await res.text();
          alert("Error saving configuration: " + err);
        }
      } catch (err) {
        alert("Network error while saving setup: " + err);
      }
    });
</script>
{{end}}
